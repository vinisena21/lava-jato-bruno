<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <!-- Ícone para iOS (Tela Inicial) - Tamanho recomendado 180x180 -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

<!-- Ícone para Navegadores e Android -->
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<link rel="manifest" href="/manifest.json" />

<!-- Nome simplificado para o ícone na tela inicial -->
<meta name="apple-mobile-web-app-title" content="LavaRápido" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Configurações PWA / App de Celular -->
    <title>Lava-Rápido Gestão</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0c232d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LavaRápido" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3100/3100821.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Registro automático do Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('Erro ao registrar Service Worker PWA:', err);
          });
        });
      }
    </script>
  </body>
</html>
